<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | NoStrings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="gradient-bg text-gray-100 font-sans min-h-screen flex flex-col">

    <header class="w-full max-w-7xl mx-auto px-6 py-5 flex justify-between items-center relative z-10">
        <a href="index.html" class="flex items-center space-x-2">
            <span class="text-2xl font-black tracking-wider text-white">No<span class="text-rose-500">Strings</span></span>
        </a>
        <a href="signin.html" class="text-sm text-gray-300 hover:text-rose-400 transition">Already have an ID? Sign in →</a>
    </header>

    <main class="flex-grow w-full max-w-md mx-auto px-6 py-8 flex flex-col justify-center relative z-10">
        <div class="text-center mb-8">
            <span class="bg-rose-500/10 text-rose-400 text-xs font-semibold tracking-widest uppercase px-3 py-1 rounded-full border border-rose-500/20">Step 1 of 1</span>
            <h1 class="text-3xl sm:text-4xl font-black text-white mt-4">Create your account</h1>
            <p class="text-gray-400 text-sm mt-2">Takes less than a minute. Adults 18+ only.</p>
        </div>

        <form id="register-form" novalidate class="surface rounded-2xl p-6 sm:p-8 space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="firstName" class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">First name</label>
                    <input id="firstName" name="firstName" type="text" required autocomplete="given-name"
                           class="field w-full rounded-xl px-4 py-3 text-white placeholder-gray-500" placeholder="Chloe">
                    <p class="error-msg text-xs text-rose-400 mt-1 hidden"></p>
                </div>
                <div>
                    <label for="lastName" class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Last name</label>
                    <input id="lastName" name="lastName" type="text" required autocomplete="family-name"
                           class="field w-full rounded-xl px-4 py-3 text-white placeholder-gray-500" placeholder="Adams">
                    <p class="error-msg text-xs text-rose-400 mt-1 hidden"></p>
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Email</label>
                <input id="email" name="email" type="email" required autocomplete="email"
                       class="field w-full rounded-xl px-4 py-3 text-white placeholder-gray-500" placeholder="you@example.com">
                <p class="error-msg text-xs text-rose-400 mt-1 hidden"></p>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Password</label>
                <div class="relative">
                    <input id="password" name="password" type="password" required autocomplete="new-password"
                           class="field w-full rounded-xl px-4 py-3 pr-16 text-white placeholder-gray-500" placeholder="••••••••">
                    <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 hover:text-white">Show</button>
                </div>
                <p class="error-msg text-xs text-rose-400 mt-1 hidden"></p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="gender" class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Gender</label>
                    <select id="gender" name="gender" required class="field w-full rounded-xl px-4 py-3 text-white">
                        <option value="" disabled selected>Select…</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                    <p class="error-msg text-xs text-rose-400 mt-1 hidden"></p>
                </div>
                <div>
                    <label for="dob" class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Date of birth</label>
                    <input id="dob" name="dob" type="date" required
                           class="field w-full rounded-xl px-4 py-3 text-white">
                    <p class="error-msg text-xs text-rose-400 mt-1 hidden"></p>
                </div>
            </div>

            <p id="form-error" class="text-sm text-rose-400 hidden"></p>

            <button type="submit" id="submit-btn"
                    class="w-full btn-primary text-white font-semibold px-8 py-3.5 rounded-xl shadow-lg shadow-rose-500/20 transition-transform active:scale-95">
                Create Account
            </button>

            <p class="text-xs text-gray-500 text-center">You must be 18 or older to register.</p>
        </form>
    </main>

    <!-- Success modal shows the User ID — the only "login key" the backend issues -->
    <div id="success-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-6 bg-black/70 backdrop-blur-sm">
        <div class="surface rounded-2xl p-6 sm:p-8 max-w-md w-full text-center space-y-4">
            <div class="w-14 h-14 mx-auto rounded-full bg-rose-500/15 flex items-center justify-center text-2xl">🎉</div>
            <h2 class="text-xl font-black text-white">Welcome, <span id="welcome-name"></span>!</h2>
            <p class="text-sm text-gray-400">Save this User ID — it's how you'll sign back in. There's no password recovery, so keep it somewhere safe.</p>
            <div class="flex items-center gap-2 field rounded-xl px-4 py-3">
                <code id="user-id-display" class="text-rose-300 text-sm font-mono break-all flex-1 text-left"></code>
                <button id="copy-id-btn" type="button" class="text-xs font-semibold text-white bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg shrink-0">Copy</button>
            </div>
            <button id="continue-btn" class="w-full btn-primary text-white font-semibold px-8 py-3.5 rounded-xl">
                Continue to Dashboard
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
