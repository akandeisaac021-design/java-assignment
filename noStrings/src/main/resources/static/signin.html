<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | NoStrings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="gradient-bg text-gray-100 font-sans min-h-screen flex flex-col">

    <header class="w-full max-w-7xl mx-auto px-6 py-5 flex justify-between items-center relative z-10">
        <a href="index.html" class="flex items-center space-x-2">
            <span class="text-2xl font-black tracking-wider text-white">No<span class="text-rose-500">Strings</span></span>
        </a>
        <a href="register.html" class="text-sm text-gray-300 hover:text-rose-400 transition">New here? Create an account →</a>
    </header>

    <main class="flex-grow w-full max-w-md mx-auto px-6 py-8 flex flex-col justify-center relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-black text-white">Sign in</h1>
            <p class="text-gray-400 text-sm mt-2">Enter the User ID you were given when you registered.</p>
        </div>

        <form id="signin-form" novalidate class="surface rounded-2xl p-6 sm:p-8 space-y-5">
            <div>
                <label for="userId" class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">User ID</label>
                <input id="userId" name="userId" type="text" required autocomplete="off"
                       class="field w-full rounded-xl px-4 py-3 text-white placeholder-gray-500 font-mono text-sm" placeholder="e.g. 6f2a9c1e-...">
                <p class="error-msg text-xs text-rose-400 mt-1 hidden"></p>
            </div>

            <p id="form-error" class="text-sm text-rose-400 hidden"></p>

            <button type="submit" id="submit-btn"
                    class="w-full btn-primary text-white font-semibold px-8 py-3.5 rounded-xl shadow-lg shadow-rose-500/20 transition-transform active:scale-95">
                Sign In
            </button>
        </form>

        <p class="text-xs text-gray-500 text-center mt-6">
            Lost your User ID? There's no recovery yet — you'll need to
            <a href="register.html" class="text-rose-400 hover:underline">create a new account</a>.
        </p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/signin.js"></script>
</body>
</html>
